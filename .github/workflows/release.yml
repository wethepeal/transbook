name: release

# 打 tag（v0.1.0 这种）就自动构建并发布；也可以在 Actions 页面手动触发只做构建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 建 Release、传附件都算 contents 权限，用仓库自带的 GITHUB_TOKEN 即可，
# **不需要额外配 PAT 密钥**。
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # 版本按各 Action 的 `runs.using` 选，取首个 node24 版本（见 ci.yml 的说明）
      - uses: actions/checkout@v5

      - name: 安装 Node（构建前端用）
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 固定 Python 3.12
        run: uv python install 3.12

      - name: 发布前先跑测试
        run: |
          uv sync --locked --group dev
          uv run pytest -q

      # 这一步内部会：构建前端 → 打 wheel → **复核 wheel 里真有界面** → 组装 zip
      - name: 构建发布包
        run: uv run python tools/build_release.py

      - name: 留档构建产物
        uses: actions/upload-artifact@v6
        with:
          name: transbook-dist
          path: dist/*
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.zip \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
