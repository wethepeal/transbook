name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与静态检查
    # 项目是 Windows 专向（PDF/Typst 路径、pypdfium2 原生库都按 Windows 实测），
    # 所以 CI 也跑 Windows，避免"Linux 上绿、Windows 上红"的假阳性。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 固定 Python 3.12（pyproject 钉了 >=3.12,<3.13）
        run: uv python install 3.12

      - name: 同步依赖（严格按 uv.lock）
        run: uv sync --locked --group dev

      # 存量告警已清零（`tools/*` 按目录放宽了 UP031/E501/B007，理由见 pyproject.toml），
      # 所以这一步是**阻断**的——从今往后新增告警会直接让 CI 变红。
      - name: ruff 静态检查
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q
