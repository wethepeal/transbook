name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 连推几次时，旧的那次已经没有意义了，直接取消，别占着 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与静态检查
    # 项目是 Windows 专向（PDF/Typst 路径、pypdfium2 原生库都按 Windows 实测），
    # 所以 CI 也跑 Windows，避免"Linux 上绿、Windows 上红"的假阳性。
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # Action 的版本按它自己 action.yml 里声明的 `runs.using` 选：
      # v4 仍是 node20，已触发 GitHub 的弃用告警；v5 起是 node24。
      # 这里取**首个 node24 版本**而不是最新版，把行为变更的风险压到最小。
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 固定 Python 3.12（pyproject 钉了 >=3.12,<3.13）
        run: uv python install 3.12

      - name: 同步依赖（严格按 uv.lock）
        run: uv sync --locked --group dev

      # 存量告警已清零（`tools/*` 按目录放宽了 UP031/E501/B007，理由见 pyproject.toml），
      # 所以这一步是**阻断**的——从今往后新增告警会直接让 CI 变红。
      - name: ruff 静态检查
        run: uv run ruff check .

      # 这个项目真的踩过一次：真实 API Key 被写进测试文件并推送上去，
      # 只能重写历史清除、密钥作废重发。所以就别指望人自觉了，让 CI 每次拦一道。
      - name: 密钥泄露检查
        run: uv run python tools/check_secrets.py

      - name: pytest
        run: uv run pytest -q
