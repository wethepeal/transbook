name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与静态检查
    # 项目是 Windows 专向（PDF/Typst 路径、pypdfium2 原生库都按 Windows 实测），
    # 所以 CI 也跑 Windows，避免"Linux 上绿、Windows 上红"的假阳性。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 固定 Python 3.12（pyproject 钉了 >=3.12,<3.13）
        run: uv python install 3.12

      - name: 同步依赖（严格按 uv.lock）
        run: uv sync --locked --group dev

      # 存量告警还有 85 个（src 59 / tests 30），其中 23 个是 B008——
      # Typer/FastAPI 的默认参数惯用法，属 ruff 误报。清理是独立的一件事，
      # 在收拾干净之前这里**不阻断**，否则 CI 从第一天就是红的、没人会看。
      - name: ruff 静态检查（信息性，暂不阻断）
        continue-on-error: true
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q
