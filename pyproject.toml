[project]
name = "transbook"
version = "0.1.0"
description = "电子书翻译流水线：PDF/EPUB 电子书（英/日）→ 中文（EPUB/PDF 输出）"
readme = "docs/plan.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "rich>=13.9",
    "typst>=0.15.0",
    "pypdfium2>=5.13.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
tp = "transbook.cli:app"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transbook"]

# 前端构建产物（web/dist）在 .gitignore 里，但**必须**进 wheel：
# 私人电脑上装包即用，不该为了一个界面去装 Node。
#
# 这里刻意不用 pyproject 的 `force-include` 表——那张表在前端没构建时直接抛
# FileNotFoundError，会把 `uv sync` / `uv build` 全打挂（全新 clone 就是这种情况）。
# 改用 hatch_build.py 钩子：有产物就嵌入，没有就跳过并告警，开发流程不受影响。
# 发布包由 tools/build_release.py 负责保证前端存在，并在打包后复核 wheel 内容。
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
