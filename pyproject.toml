[project]
name = "transbook"
version = "0.1.0"
description = "电子书翻译流水线：PDF/EPUB 电子书（英/日）→ 中文（EPUB/PDF 输出）"
readme = "docs/plan.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "rich>=13.9",
]

[project.scripts]
tp = "transbook.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transbook"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
