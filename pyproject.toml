[project]
name = "transbook"
version = "0.1.0"
description = "电子书翻译流水线：PDF/EPUB 电子书（英/日）→ 中文（EPUB/PDF 输出）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "rich>=13.9",
    "typst>=0.15.0",
    "pypdfium2>=5.13.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
tp = "transbook.cli:app"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transbook"]

# 前端构建产物（web/dist）在 .gitignore 里，但**必须**进 wheel：
# 私人电脑上装包即用，不该为了一个界面去装 Node。
#
# 这里刻意不用 pyproject 的 `force-include` 表——那张表在前端没构建时直接抛
# FileNotFoundError，会把 `uv sync` / `uv build` 全打挂（全新 clone 就是这种情况）。
# 改用 hatch_build.py 钩子：有产物就嵌入，没有就跳过并告警，开发流程不受影响。
# 发布包由 tools/build_release.py 负责保证前端存在，并在打包后复核 wheel 内容。
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 报的是"在默认参数里调用函数"，但 `x: str = typer.Option(...)`、`d: X = Depends(...)`
# 恰恰是 Typer / FastAPI 的**规定写法**，不是 bug——关掉整条规则，而不是到处写 noqa。
# （全部 23 处命中都是这一类，已逐一核对。）
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# `tools/` 下全是**开发期的一次性探针与基准脚本**，不进任何产物。这里只放宽三条，
# 其余规则（未定义名 F821、未用导入 F401、未绑定循环变量 B023 等真问题）照查：
#   UP031 —— 这些脚本大量用 %-格式化打印对齐表格，改成 f-string 反而更难读；
#   E501 —— 部分"样本串"刻意写得极长（如 typst_check / render_bench 里 240+ 字的
#           中英混排段落），目的就是逼排版引擎处理自动换行，拆行会破坏意图；
#   B007 —— `for i, _ in enumerate(...)` 这类占位循环变量。
"tools/*" = ["UP031", "E501", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
