<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="transbook：把英/日文电子书翻成中文的流水线，在这里上传、看进度、逐段校对、下载成品。"
    />
    <!-- 深色与浅色都支持；具体哪套由 <html data-theme> 决定，
         原生下拉列表、滚动条、日期选择器会跟着走 -->
    <meta name="color-scheme" content="dark light" />
    <title>transbook · 电子书翻译流水线</title>
    <!-- 必须在**首次绘制之前**定好主题：等打包后的 JS 执行再切，选了浅色的人
         每次刷新都会先闪一下深色。这段不能挪进 bundle——bundle 是异步加载的。 -->
    <script>
      try {
        var t = localStorage.getItem('transbook-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        /* 隐私模式下读不了 localStorage：用 CSS 里的默认值（深色）即可 */
      }
    </script>
    <!-- 图标内联成 SVG data URI：不额外发一个请求，也不引入二进制文件。
         三条横线读作「文本」，16px 下仍然认得出。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a21'/%3E%3Cpath d='M9 9h14M9 16h14M9 23h9' stroke='%237ea9e0' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
